name: python CI

on:
- pull_request
- push

jobs:
  tox_test:
    name: Run tox (${{ matrix.python_version }})
    strategy:
      matrix:
        python_version: [3.9, 3.12]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    permissions:
      contents: read
      pages: write
      id-token: write
      statuses: write

    steps:
    - uses: actions/checkout@v2

    - name: Set up Python ${{ matrix.python_version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python_version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install tox

    - name: Display Python SSL runtime details
      run: |
        python -c "import ssl; print('Python SSL:', ssl.OPENSSL_VERSION)"

    - name: Display OpenSSL providers and PQC algorithms
      run: |
        openssl version
        openssl list -providers || true
        openssl list -public-key-algorithms | grep -i mldsa || true
        openssl list -public-key-algorithms | grep -i mlkem || true

    - name: Run tox tests
      run: tox

    - name: Generate coverage XML
      run: |
        pip install coverage
        coverage xml

    - name: Build docs for Pages deploy
      if: success() && github.event_name == 'push' && matrix.python_version == '3.9'
      run: tox -e docs

    - name: Verify docs build output exists
      if: success() && github.event_name == 'push' && matrix.python_version == '3.9'
      run: test -d docs/build/html

    - name: Configure GitHub Pages
      if: success() && github.event_name == 'push' && matrix.python_version == '3.9'
      uses: actions/configure-pages@v5

    - name: Upload GitHub Pages artifact
      if: success() && github.event_name == 'push' && matrix.python_version == '3.9'
      uses: actions/upload-pages-artifact@v3
      with:
        path: docs/build/html

    - name: Deploy to GitHub Pages
      if: success() && github.event_name == 'push' && matrix.python_version == '3.9'
      id: deployment
      uses: actions/deploy-pages@v4

    - name: Upload coverage to Coveralls
      id: coveralls
      uses: coverallsapp/github-action@v2
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        flag-name: Unit-Test
        format: cobertura
        file: coverage.xml
      env:
        COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_TOKEN }}
      continue-on-error: true

    - name: Create coverage status check
      if: always() && (github.event_name == 'push' || github.event.pull_request.head.repo.fork == false)
      uses: actions/github-script@v6
      with:
        script: |
          const coverage_result = '${{ steps.coveralls.outcome }}';
          const conclusion = coverage_result === 'success' ? 'success' : 'neutral';
          const sha = context.eventName === 'pull_request'
            ? context.payload.pull_request.head.sha
            : context.sha;
          
          await github.rest.repos.createCommitStatus({
            owner: context.repo.owner,
            repo: context.repo.repo,
            sha,
            state: conclusion === 'success' ? 'success' : 'failure',
            target_url: 'https://coveralls.io/github/${{ github.repository }}',
            description: 'Coverage report uploaded',
            context: 'coverage/coveralls'
          });
